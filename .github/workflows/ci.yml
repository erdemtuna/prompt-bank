name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Validate, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run ci

  rust-core:
    name: Rust core tests (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            name: Linux
          - platform: windows-latest
            name: Windows
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        # Upstream ref: dtolnay/rust-toolchain@master; selected toolchain: 1.94.0.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test the pure core crate (no webview libraries needed)
        working-directory: src-tauri
        run: cargo test -p prompt-bank-core --locked
      - name: Summarize platform result
        if: always()
        shell: bash
        env:
          PLATFORM_NAME: ${{ matrix.name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          printf '### Rust core (%s)\nResult: **%s**\n' "$PLATFORM_NAME" "$JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
